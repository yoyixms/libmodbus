; PlatformIO project for the transport-only Modbus RTU Arduino example.
;
; MODBUS_TRANSPORT_ONLY must be a build flag (not only in config.h): modbus.c and
; modbus-data.c #include <config.h>, but modbus-tcp.c/modbus-rtu.c receive the
; macro from the compiler flags, so all four sources need it defined here.
;
; Set `board` to your target. Any board with a HardwareSerial works; 32-bit
; boards (ESP32, ESP8266, SAMD, Teensy, RP2040) are recommended over AVR Uno,
; which is tight on flash/RAM and lacks some headers the framing relies on.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_flags = -DMODBUS_TRANSPORT_ONLY
